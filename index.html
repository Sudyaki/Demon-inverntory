<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ShoeStock Inventory</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<main id="login" class="login" hidden>
  <form id="loginForm" class="card">
    <h1>👟 ShoeStock</h1>
    <p class="muted">Sign in to continue</p>
    <label>Username<input name="username" autocomplete="username" required></label>
    <label>Password<input name="password" type="password" autocomplete="current-password" required></label>
    <p id="loginErr" class="err"></p>
    <button class="btn primary wide" type="submit">Log in</button>
    <div class="hint">Demo logins:<br><b>admin</b> / admin123 (full access)<br><b>employee</b> / employee123 (sell only)<br>Data is saved in your own browser only.</div>
  </form>
</main>

<div id="app" hidden>
  <header class="top">
    <strong>👟 ShoeStock</strong>
    <span class="grow"></span>
    <span id="who" class="muted"></span>
    <button class="btn" id="btnSales" data-admin>Sales log</button>
    <button class="btn" id="btnUsers" data-admin>Users</button>
    <button class="btn" id="btnReset" data-admin>Reset demo</button>
    <button class="btn" id="btnLogout">Log out</button>
  </header>
  <div class="layout">
    <section class="panel">
      <div class="bar">
        <input id="q" type="search" placeholder="Search shoes: brand, name, color, size (e.g. nike jordan white)">
        <button class="btn primary" id="btnAdd" data-admin>+ Add product</button>
      </div>
      <p id="count" class="muted"></p>
      <div id="list" class="list"></div>
    </section>
    <aside class="panel sale">
      <h2>Current sale</h2>
      <div id="cart"></div>
      <div class="calc">
        <div class="row"><span>Total</span><strong id="total">0.00</strong></div>
        <label>Customer pays<input id="paid" type="number" min="0" step="0.01" inputmode="decimal" placeholder="0.00"></label>
        <div class="quick" id="quick"></div>
        <div class="row big"><span id="chgLabel">Change</span><strong id="change">0.00</strong></div>
        <button class="btn primary wide" id="btnSell" disabled>Complete sale</button>
        <button class="btn wide" id="btnClear">Clear</button>
      </div>
    </aside>
  </div>
</div>
<dialog id="dlg"></dialog>
<div id="toast" role="status"></div>
<script src="js/app.js"></script>
</body>
</html>
